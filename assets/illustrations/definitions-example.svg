<svg xmlns="http://www.w3.org/2000/svg" width="640" height="608" viewBox="0 0 640 608" role="img" aria-labelledby="title desc">
  <title id="title">Six terms in one fictional trail example</title>
  <desc id="desc">A fictional trail claim has two subclaims. The survey gives a distance but does not discuss shade. The illustrative verdict and confidence are separate.</desc>
  <rect x="1" y="1" width="638" height="606" rx="18" fill="#121b1e" stroke="#617977" stroke-width="2"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="25" y="43" font-size="24" fill="#f2ca82" font-weight="700">ONE FICTIONAL TRAIL EXAMPLE</text><rect x="25" y="65" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="97" font-size="27" fill="#f5f1e7" font-weight="700">Claim</text><text x="44" y="126" font-size="23" fill="#b9cac6">The trail is about 2 km long and fully shaded.</text><rect x="25" y="153" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="185" font-size="27" fill="#f5f1e7" font-weight="700">Subclaims</text><text x="44" y="214" font-size="23" fill="#b9cac6">Check the length and the shade separately.</text><rect x="25" y="241" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="273" font-size="27" fill="#f5f1e7" font-weight="700">Cited source</text><text x="44" y="302" font-size="23" fill="#b9cac6">A park survey.</text><rect x="25" y="329" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="361" font-size="27" fill="#f5f1e7" font-weight="700">Evidence</text><text x="44" y="390" font-size="23" fill="#b9cac6">The survey measures the trail at 1.9 km.</text><rect x="25" y="417" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="449" font-size="27" fill="#f5f1e7" font-weight="700">Verdict · Partially supported</text><text x="44" y="478" font-size="23" fill="#b9cac6">The survey backs the length and leaves shade open.</text><rect x="25" y="505" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="537" font-size="27" fill="#f5f1e7" font-weight="700">Confidence · High (illustrative)</text><text x="44" y="566" font-size="23" fill="#b9cac6">The distance is clear. The survey leaves shade open.</text>
  </g>
</svg>
