<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
  <title id="title">How to assess a claim</title>
  <desc id="desc">Seven steps from identifying the claim through review, with a separate path when there is not enough source material to judge.</desc>
  <rect x="1" y="1" width="638" height="818" rx="18" fill="#121b1e" stroke="#617977" stroke-width="2"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="25" y="43" font-size="24" fill="#f2ca82" font-weight="700">FROM CLAIM TO REVIEW</text><rect x="25" y="65" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="90" r="13" fill="#f2ca82"/><text x="45" y="97" font-size="19" fill="#121b1e" font-weight="700">1</text><text x="77" y="95" font-size="26" fill="#f5f1e7" font-weight="700">Identify the claim</text><text x="77" y="124" font-size="23" fill="#b9cac6">Save its wording and context.</text><path d="M51 133L51 152" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="156" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="181" r="13" fill="#f2ca82"/><text x="45" y="188" font-size="19" fill="#121b1e" font-weight="700">2</text><text x="77" y="186" font-size="26" fill="#f5f1e7" font-weight="700">Break it into checkable parts</text><text x="77" y="215" font-size="23" fill="#b9cac6">Separate details you can check independently.</text><path d="M51 224L51 243" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="247" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="272" r="13" fill="#f2ca82"/><text x="45" y="279" font-size="19" fill="#121b1e" font-weight="700">3</text><text x="77" y="277" font-size="26" fill="#f5f1e7" font-weight="700">Inspect the cited source</text><text x="77" y="306" font-size="23" fill="#b9cac6">Check what you can access.</text><path d="M51 315L51 334" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="338" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="363" r="13" fill="#f2ca82"/><text x="45" y="370" font-size="19" fill="#121b1e" font-weight="700">4</text><text x="77" y="368" font-size="26" fill="#f5f1e7" font-weight="700">Locate relevant evidence</text><text x="77" y="397" font-size="23" fill="#b9cac6">Record where the passage appears.</text><path d="M51 406L51 425" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="429" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="454" r="13" fill="#f2ca82"/><text x="45" y="461" font-size="19" fill="#121b1e" font-weight="700">5</text><text x="77" y="459" font-size="26" fill="#f5f1e7" font-weight="700">Compare the details</text><text x="77" y="488" font-size="23" fill="#b9cac6">Check wording, time, scope, and quantities.</text><path d="M51 497L51 516" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="520" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="545" r="13" fill="#f2ca82"/><text x="45" y="552" font-size="19" fill="#121b1e" font-weight="700">6</text><text x="77" y="550" font-size="26" fill="#f5f1e7" font-weight="700">Record verdict and confidence</text><text x="77" y="579" font-size="23" fill="#b9cac6">Explain your reasoning and uncertainty.</text><path d="M51 588L51 607" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="611" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="636" r="13" fill="#f2ca82"/><text x="45" y="643" font-size="19" fill="#121b1e" font-weight="700">7</text><text x="77" y="641" font-size="26" fill="#f5f1e7" font-weight="700">Review the assessment</text><text x="77" y="670" font-size="23" fill="#b9cac6">Compare independent checks and keep differences.</text><rect x="25" y="708" width="590" height="86" rx="12" fill="#23363a" stroke="#617977"/><text x="44" y="743" font-size="27" fill="#f2ca82" font-weight="700">Can’t access enough to judge?</text><text x="44" y="774" font-size="23" fill="#b9cac6">Record the limitation and leave the verdict unset.</text>
  </g>
</svg>
