<svg xmlns="http://www.w3.org/2000/svg" width="640" height="763" viewBox="0 0 640 763" role="img" aria-labelledby="title desc">
  <title id="title">Verdicts, access limits, and confidence</title>
  <desc id="desc">The five verdicts describe what the source establishes. Access limits leave the verdict unset. Confidence is a separate dimension.</desc>
  <rect x="1" y="1" width="638" height="761" rx="18" fill="#121b1e" stroke="#617977" stroke-width="2"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="25" y="43" font-size="24" fill="#f2ca82" font-weight="700">WHAT THE SOURCE ESTABLISHES</text><rect x="25" y="62" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="94" font-size="27" fill="#f5f1e7" font-weight="700">Supported</text><text x="44" y="123" font-size="23" fill="#b9cac6">Backs the statement and its important details.</text><rect x="25" y="145" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="177" font-size="27" fill="#f5f1e7" font-weight="700">Partially supported</text><text x="44" y="206" font-size="23" fill="#b9cac6">Backs part of it or a narrower version.</text><rect x="25" y="228" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="260" font-size="27" fill="#f5f1e7" font-weight="700">Compatible but unconfirmed</text><text x="44" y="289" font-size="23" fill="#b9cac6">Allows a cautious inference without confirming it.</text><rect x="25" y="311" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="343" font-size="27" fill="#f5f1e7" font-weight="700">Not supported</text><text x="44" y="372" font-size="23" fill="#b9cac6">Gives no basis and does not directly conflict.</text><rect x="25" y="394" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="426" font-size="27" fill="#f5f1e7" font-weight="700">Contradicted</text><text x="44" y="455" font-size="23" fill="#b9cac6">Directly conflicts with the statement.</text><rect x="25" y="492" width="590" height="88" rx="12" fill="#23363a" stroke="#617977"/><text x="44" y="526" font-size="27" fill="#f2ca82" font-weight="700">Not enough source material?</text><text x="44" y="557" font-size="23" fill="#b9cac6">Record the limitation and leave the verdict unset.</text><rect x="25" y="595" width="590" height="138" rx="12" fill="#173b34" stroke="#617977"/><text x="44" y="633" font-size="27" fill="#a2e2c7" font-weight="700">Confidence is separate</text><text x="44" y="667" font-size="26" fill="#f5f1e7" font-weight="700">High · Medium · Low</text><text x="44" y="701" font-size="23" fill="#b9cac6">How sure is the assessor about their verdict?</text>
  </g>
</svg>
