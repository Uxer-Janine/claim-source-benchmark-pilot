<svg xmlns="http://www.w3.org/2000/svg" width="640" height="351" viewBox="0 0 640 351" role="img" aria-labelledby="title desc">
  <title id="title">One library, five ways to use it</title>
  <desc id="desc">Learners practice, educators teach, Wikipedia contributors check citations, researchers compare assessments, and developers validate records.</desc>
  <rect x="1" y="1" width="638" height="349" rx="18" fill="#121b1e" stroke="#617977" stroke-width="2"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="25" y="43" font-size="24" fill="#f2ca82" font-weight="700">ONE LIBRARY · FIVE WAYS TO USE IT</text><path d="M25 96L615 96" fill="none" stroke="#617977" stroke-width="2"/><text x="25" y="82" font-size="23" fill="#a2e2c7" font-weight="700">Learners</text><text x="300" y="82" font-size="23" fill="#f5f1e7">Explain a verdict.</text><path d="M25 148L615 148" fill="none" stroke="#617977" stroke-width="2"/><text x="25" y="134" font-size="23" fill="#a2e2c7" font-weight="700">Educators</text><text x="300" y="134" font-size="23" fill="#f5f1e7">Discuss a case in class.</text><path d="M25 200L615 200" fill="none" stroke="#617977" stroke-width="2"/><text x="25" y="186" font-size="23" fill="#a2e2c7" font-weight="700">Wikipedia contributors</text><text x="300" y="186" font-size="23" fill="#f5f1e7">Check citation support.</text><path d="M25 252L615 252" fill="none" stroke="#617977" stroke-width="2"/><text x="25" y="238" font-size="23" fill="#a2e2c7" font-weight="700">Researchers</text><text x="300" y="238" font-size="23" fill="#f5f1e7">Compare assessments.</text><path d="M25 304L615 304" fill="none" stroke="#617977" stroke-width="2"/><text x="25" y="290" font-size="23" fill="#a2e2c7" font-weight="700">Developers</text><text x="300" y="290" font-size="23" fill="#f5f1e7">Validate case records.</text>
  </g>
</svg>
