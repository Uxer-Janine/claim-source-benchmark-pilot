<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
  <title id="title">What does the citation support?</title>
  <desc id="desc">Four steps connect a claim to its cited source, relevant evidence, and an assessment. Finding out whether a claim is true may require other evidence.</desc>
  <rect x="1" y="1" width="638" height="508" rx="18" fill="#121b1e" stroke="#617977" stroke-width="2"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="25" y="43" font-size="24" fill="#f2ca82" font-weight="700">WHAT DOES THE CITATION SUPPORT?</text><rect x="25" y="65" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="90" r="13" fill="#f2ca82"/><text x="45" y="97" font-size="19" fill="#121b1e" font-weight="700">1</text><text x="77" y="95" font-size="26" fill="#f5f1e7" font-weight="700">Wikipedia claim</text><text x="77" y="124" font-size="23" fill="#b9cac6">The statement being checked.</text><path d="M51 133L51 152" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="156" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="181" r="13" fill="#f2ca82"/><text x="45" y="188" font-size="19" fill="#121b1e" font-weight="700">2</text><text x="77" y="186" font-size="26" fill="#f5f1e7" font-weight="700">Cited source</text><text x="77" y="215" font-size="23" fill="#b9cac6">The work the article points to.</text><path d="M51 224L51 243" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="247" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="272" r="13" fill="#f2ca82"/><text x="45" y="279" font-size="19" fill="#121b1e" font-weight="700">3</text><text x="77" y="277" font-size="26" fill="#f5f1e7" font-weight="700">Relevant evidence</text><text x="77" y="306" font-size="23" fill="#b9cac6">The part of the source that bears on the claim.</text><path d="M51 315L51 334" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="338" width="590" height="74" rx="12" fill="#1b292d" stroke="#617977"/><circle cx="51" cy="363" r="13" fill="#f2ca82"/><text x="45" y="370" font-size="19" fill="#121b1e" font-weight="700">4</text><text x="77" y="368" font-size="26" fill="#f5f1e7" font-weight="700">Assessment</text><text x="77" y="397" font-size="23" fill="#b9cac6">A judgment with evidence and reasoning.</text><path d="M25 425L615 425" fill="none" stroke="#617977" stroke-width="2"/><text x="25" y="461" font-size="27" fill="#a2e2c7" font-weight="700">Is the claim true?</text><text x="25" y="491" font-size="24" fill="#b9cac6">That question may require other evidence.</text>
  </g>
</svg>
