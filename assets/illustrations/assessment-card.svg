<svg xmlns="http://www.w3.org/2000/svg" width="640" height="802" viewBox="0 0 640 802" role="img" aria-labelledby="title desc">
  <title id="title">Read a documented assessment</title>
  <desc id="desc">An annotated card uses A04 to show where the claim summary, citation, evidence location, subclaim judgment, verdict, confidence, reasoning, and review status appear.</desc>
  <rect x="1" y="1" width="638" height="800" rx="18" fill="#121b1e" stroke="#617977" stroke-width="2"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="25" y="43" font-size="24" fill="#f2ca82" font-weight="700">AN ASSESSMENT AT A GLANCE · A04</text><rect x="55" y="66" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 103L55 103" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="103" r="4" fill="#f2ca82"/><text x="72" y="96" font-size="25" fill="#a2e2c7" font-weight="700">Claim summary</text><text x="72" y="125" font-size="23" fill="#f5f1e7">Revenue estimate and IVF clinic count.</text><rect x="55" y="154" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 191L55 191" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="191" r="4" fill="#f2ca82"/><text x="72" y="184" font-size="25" fill="#a2e2c7" font-weight="700">Source citation</text><text x="72" y="213" font-size="23" fill="#f5f1e7">Hibino’s 2023 article on surrogacy in India.</text><rect x="55" y="242" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 279L55 279" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="279" r="4" fill="#f2ca82"/><text x="72" y="272" font-size="25" fill="#a2e2c7" font-weight="700">Evidence location</text><text x="72" y="301" font-size="23" fill="#f5f1e7">Page 2 · Background · Paragraph 3 · Line 1</text><rect x="55" y="330" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 367L55 367" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="367" r="4" fill="#f2ca82"/><text x="72" y="360" font-size="25" fill="#a2e2c7" font-weight="700">Subclaim judgment</text><text x="72" y="389" font-size="23" fill="#f5f1e7">Revenue estimate · Supported</text><rect x="55" y="418" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 455L55 455" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="455" r="4" fill="#f2ca82"/><text x="72" y="448" font-size="25" fill="#a2e2c7" font-weight="700">Overall verdict</text><text x="72" y="477" font-size="23" fill="#f5f1e7">Partially supported</text><rect x="55" y="506" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 543L55 543" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="543" r="4" fill="#f2ca82"/><text x="72" y="536" font-size="25" fill="#a2e2c7" font-weight="700">Confidence</text><text x="72" y="565" font-size="23" fill="#f5f1e7">Medium</text><rect x="55" y="594" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 631L55 631" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="631" r="4" fill="#f2ca82"/><text x="72" y="624" font-size="25" fill="#a2e2c7" font-weight="700">Reasoning</text><text x="72" y="653" font-size="23" fill="#f5f1e7">The amount clears the stated threshold.</text><rect x="55" y="682" width="560" height="77" rx="12" fill="#1b292d" stroke="#617977"/><path d="M25 719L55 719" fill="none" stroke="#f2ca82" stroke-width="2"/><circle cx="25" cy="719" r="4" fill="#f2ca82"/><text x="72" y="712" font-size="25" fill="#a2e2c7" font-weight="700">Review status</text><text x="72" y="741" font-size="23" fill="#f5f1e7">Awaiting independent review</text>
  </g>
</svg>
